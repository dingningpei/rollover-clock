# Monthly update of the rollover-clock data (data/release/).
# The MSPD for month t appears around the fifth business day of t+1; runs on the 8th and 15th
# (the second run picks up a late release) and can be started by hand.
name: Update monthly rollover clock

on:
  schedule:
    - cron: "23 14 8,15 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    if: github.repository == 'dingningpei/rollover-clock'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "numpy>=2.0" "pandas>=2.0" "matplotlib>=3.8"
      - name: Restore downloaded inputs
        uses: actions/cache@v4
        with:
          path: |
            data/raw/fiscaldata/mspd_table_3_market_monthly
            data/raw/fed/soma
          key: raw-${{ github.run_id }}
          restore-keys: raw-
      - name: Build
        run: python -m src.release.monthly_clock
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/release
          if git diff --cached --quiet; then
            echo "No new data."
          else
            git commit -m "Monthly data: through $(tail -1 data/release/rollover_clock_monthly.csv | cut -d, -f1)"
            git push
          fi
